<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Connectly</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="layout">
  <section class="brand-panel">
    <div class="brand-mark">c</div><p class="eyebrow">MAKE IT YOURS</p>
    <h1>Your next favorite conversation starts <span>here.</span></h1>
    <p class="brand-copy">Create your account in a moment and make room for more of the good stuff.</p>
    <div class="decor decor-one"></div><div class="decor decor-two"></div>
  </section>
  <section class="form-panel"><div class="form-card">
    <div class="mobile-brand"><span class="brand-mark small">c</span> connectly</div>
    <p class="eyebrow">JOIN CONNECTLY</p><h2>Create account</h2><p class="subheading">A few details and you're in.</p>
    <div class="notice error" th:if="${registrationError}" th:text="${registrationError}"></div>
    <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="auth-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label for="username">Username</label><input id="username" th:field="*{username}" type="text" placeholder="e.g. alex_24" autocomplete="username" required>
      <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
      <label for="email">Email address</label><input id="email" th:field="*{email}" type="email" placeholder="you@example.com" autocomplete="email" required>
      <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
      <label for="password">Password</label><input id="password" th:field="*{password}" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
      <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
      <label for="confirmPassword">Confirm password</label><input id="confirmPassword" th:field="*{confirmPassword}" type="password" placeholder="Enter it one more time" autocomplete="new-password" required>
      <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
      <button class="primary-button" type="submit">Create account <span>→</span></button>
    </form>
    <p class="switch-copy">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    <p class="fine-print">A practice project for containerized deployment.</p>
  </div></section>
</main>
</body></html>
