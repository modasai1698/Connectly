version: "3.8"

services:
  db:
    image: connectly-db:1.0
    environment:
      MYSQL_DATABASE: accountdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ConnectlyLabApp123!
      MYSQL_ROOT_PASSWORD: ConnectlyLabRoot456!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - connectly_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: connectly-app:1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/accountdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: ConnectlyLabApp123!
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - connectly_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  connectly_net:
    driver: overlay

volumes:
  mysql_data:
